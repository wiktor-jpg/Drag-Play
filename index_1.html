<script>
const __store={};
window.storage={
  get:async(k)=>__store[k]!==undefined?{key:k,value:__store[k]}:null,
  set:async(k,v)=>{__store[k]=String(v);return{key:k,value:String(v)};},
  delete:async(k)=>{delete __store[k];return{key:k,deleted:true};},
  list:async(p)=>({keys:Object.keys(__store).filter(k=>!p||k.startsWith(p))}),
};
</script>

`;

function detectPlatform(url){
  if(/youtu\.?be/.test(url))  return{name:"YouTube",  icon:"▶",color:"#ff3e3e",bg:"rgba(255,62,62,.15)"};
  if(/soundcloud/.test(url))  return{name:"SoundCloud",icon:"◉",color:"#ff6b1a",bg:"rgba(255,107,26,.15)"};
  if(/bandcamp/.test(url))    return{name:"Bandcamp",  icon:"◈",color:"#2de0ff",bg:"rgba(45,224,255,.15)"};
  if(/tiktok/.test(url))      return{name:"TikTok",    icon:"♪",color:"#ff2d78",bg:"rgba(255,45,120,.15)"};
  if(/mixcloud/.test(url))    return{name:"Mixcloud",  icon:"≋",color:"#ffd600",bg:"rgba(255,214,0,.15)"};
  return                             {name:"URL",       icon:"↗",color:"#888",   bg:"rgba(136,136,136,.1)"};
}
function parseURLs(t){return[...new Set((t.match(/https?:\/\/[^\s,\n"'<>]+/g)||[]))];}
function fmtDur(s){const m=Math.floor(s/60),sec=s%60;return`${m}:${String(sec).padStart(2,"0")}`;}
function fmtDurLong(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);if(h>0)return`${h}h ${m}m`;return`${m}m`;}
function estDL(n,f){const b=f==="MP3"?5:f==="WAV"?9:f==="FLAC"?8:6;const t=n*b;if(t<60)return`~${t}s`;return`~${Math.ceil(t/60)} min`;}
const sc=(s)=>s==="done"?"#c6f135":s==="downloading"?"#2de0ff":s==="error"?"#ff2d78":s==="fetching"?"#ffd600":"#3d3d3d";

function Logo({size=52}){
  return(
    <svg width={size} height={size} viewBox="0 0 60 60" fill="none" style={{flexShrink:0}}>
      <rect x="2" y="2" width="56" height="56" rx="6" fill="#111" stroke="#2e2e2e" strokeWidth="1.5"/>
      <ellipse cx="30" cy="31" rx="22" ry="20" fill="rgba(198,241,53,0.08)"/>
      <path d="M14 16 H24 Q40 16 40 30 Q40 44 24 44 H14 Z" fill="none" stroke="#c6f135" strokeWidth="3" strokeLinejoin="round"/>
      <path d="M20 22 H24 Q34 22 34 30 Q34 38 24 38 H20 Z" fill="#c6f135" opacity=".12"/>
      <path d="M20 22 V38" stroke="#c6f135" strokeWidth="2.5" strokeLinecap="round"/>
      <path d="M27 27 L27 33 M27 33 L24 30 M27 33 L30 30" stroke="#c6f135" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx="44" cy="18" r="2" fill="#2de0ff" opacity=".8"/>
      <circle cx="47" cy="22" r="1.2" fill="#2de0ff" opacity=".5"/>
      <circle cx="16" cy="47" r="1.8" fill="#ff2d78" opacity=".7"/>
      <circle cx="48" cy="46" r="1" fill="#c6f135" opacity=".5"/>
      <path d="M10 51 Q30 49 50 51" stroke="#c6f135" strokeWidth="1" opacity=".3" strokeLinecap="round"/>
    </svg>
  );
}

function Notifs({list}){
  return<div className="notif-wrap">{list.map(n=>(
    <div key={n.id} className={`notif ${n.type}`}>
      <span>{n.type==="ok"?"✓":n.type==="err"?"✕":"·"}</span>{n.msg}
    </div>
  ))}</div>;
}

function ProgressModal({tracks,onCancel,startTime,isComplete,onClose}){
  const total=tracks.length,done=tracks.filter(t=>t.status==="done").length,
        errors=tracks.filter(t=>t.status==="error").length,
        pct=total===0?0:Math.round((done/total)*100),
        elapsed=(Date.now()-startTime)/1000,
        remaining=total-done,
        totalSecs=tracks.reduce((a,t)=>(t.duration||0)+a,0);
  const eta=()=>{if(done===0)return"Calculating…";const r=done/elapsed,l=remaining/r;if(!isFinite(l))return"Calculating…";const m=Math.floor(l/60),s=Math.floor(l%60);return m>0?`${m}m ${s}s remaining`:`${s}s remaining`;};
  return(
    <div className="modal-bg" onClick={e=>{if(isComplete&&e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        {!isComplete?(
          <>
            <div className="modal-title">Downloading</div>
            <div className="modal-sub">yt-dlp engine · real files</div>
            <div className="modal-bigpct">{pct}%</div>
            <div className="modal-bar-track"><div className="modal-bar-fill" style={{width:`${pct}%`}}/></div>
            <div className="modal-stats-row">
              <div className="mstat"><div className="mstat-lbl">Done</div><div className="mstat-val g">{done}</div></div>
              <div className="mstat"><div className="mstat-lbl">Remaining</div><div className="mstat-val b">{remaining}</div></div>
              <div className="mstat"><div className="mstat-lbl">Errors</div><div className="mstat-val" style={{color:errors>0?"#ff2d78":"#555"}}>{errors}</div></div>
            </div>
            <div style={{fontFamily:"var(--font-m)",fontSize:11,color:"var(--muted)",marginBottom:14}}>
              ETA: <strong style={{color:"var(--white)"}}>{eta()}</strong>
            </div>
            <div style={{background:"var(--panel)",borderRadius:5,padding:"8px 10px",maxHeight:160,overflowY:"auto"}}>
              {tracks.map(t=>(
                <div key={t.id} className="mini-track">
                  <div className="mini-dot" style={{background:sc(t.status)}}/>
                  <div className="mini-name">{t.title}</div>
                  <div className="mini-prog">{t.status==="done"?"✓":t.status==="error"?"✕":t.status==="downloading"?"↓":t.status==="fetching"?"…":"—"}</div>
                </div>
              ))}
            </div>
            <button className="modal-cancel" onClick={onCancel}>✕ Cancel</button>
          </>
        ):(
          <div className="modal-done-row">
            <div className="modal-done-icon">⬇</div>
            <div className="modal-done-title">Files downloaded!</div>
            <div className="modal-done-sub">{done} tracks{totalSecs>0?` · ${fmtDurLong(totalSecs)} of music`:""}{errors>0?` · ${errors} failed`:""}</div>
            <div className="modal-stats-row" style={{marginBottom:20}}>
              <div className="mstat"><div className="mstat-lbl">Downloaded</div><div className="mstat-val g">{done}</div></div>
              <div className="mstat"><div className="mstat-lbl">Music</div><div className="mstat-val b">{totalSecs>0?fmtDurLong(totalSecs):"—"}</div></div>
              <div className="mstat"><div className="mstat-lbl">Failed</div><div className="mstat-val" style={{color:errors>0?"#ff2d78":"#555"}}>{errors}</div></div>
            </div>
            <button style={{width:"100%",padding:"14px",background:"var(--g)",color:"var(--black)",border:"none",borderRadius:5,cursor:"pointer",fontFamily:"var(--font-m)",fontWeight:700,fontSize:12,textTransform:"uppercase",letterSpacing:".08em"}} onClick={onClose}>
              → Back to queue
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [tracks,setTracks]=useState([]);
  const [paste,setPaste]=useState("");
  const [over,setOver]=useState(false);
  const [fmt,setFmt]=useState("MP3");
  const [qual,setQual]=useState("320");
  const [running,setRunning]=useState(false);
  const [showModal,setShowModal]=useState(false);
  const [modalDone,setModalDone]=useState(false);
  const [startTime,setStartTime]=useState(null);
  const [tab,setTab]=useState("queue");
  const [history,setHistory]=useState([]);
  const [notifs,setNotifs]=useState([]);
  const [totalAll,setTotalAll]=useState(0);
  const [backendStatus,setBackendStatus]=useState("checking");
  const cancelRef=useRef(false);

  // Check backend on load
  useEffect(()=>{
    if(BACKEND==="PLACEHOLDER_REMOVED"){setBackendStatus("unconfigured");return;}
    fetch(`${BACKEND}/health`).then(r=>r.ok?setBackendStatus("ok"):setBackendStatus("err")).catch(()=>setBackendStatus("err"));
  },[]);

  useEffect(()=>{
    (async()=>{
      try{const r=await window.storage.get("dp3-hist");if(r)setHistory(JSON.parse(r.value));}catch{}
      try{const r=await window.storage.get("dp3-total");if(r)setTotalAll(JSON.parse(r.value));}catch{}
    })();
  },[]);

  const addNotif=useCallback((msg,type="info")=>{
    const id=Date.now()+Math.random();
    setNotifs(n=>[...n,{id,msg,type}]);
    setTimeout(()=>setNotifs(n=>n.filter(x=>x.id!==id)),3400);
  },[]);

  const addURLs=useCallback(async(urls)=>{
    const valid=urls.filter(u=>{try{new URL(u);return true;}catch{return false;}});
    if(!valid.length){addNotif("No valid URLs","err");return;}

    for(const url of valid){
      // Fetch real info from backend
      const tmpId=Date.now()+Math.random();
      setTracks(t=>[...t,{id:tmpId,url,title:"Fetching info…",platform:detectPlatform(url),status:"fetching",progress:0,bpm:null,key:null,duration:0}]);
      try{
        const res=await fetch(`${BACKEND}/info`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({url})});
        const data=await res.json();
        if(data.type==="playlist"){
          // Remove the temp track and add all playlist tracks
          setTracks(t=>t.filter(x=>x.id!==tmpId));
          const plTracks=data.tracks.map((tr,i)=>({
            id:Date.now()+Math.random()+i*.001,
            url:tr.url,
            title:tr.title||`Track ${i+1}`,
            platform:detectPlatform(url),
            status:"queued",progress:0,bpm:null,key:null,
            duration:tr.duration||0,
          }));
          setTracks(t=>[...t,...plTracks]);
          addNotif(`Playlist: ${data.count} tracks added`,"ok");
        } else {
          setTracks(t=>t.map(x=>x.id===tmpId?{...x,status:"queued",title:data.title||x.url,duration:data.duration||0}:x));
        }
      }catch(e){
        setTracks(t=>t.map(x=>x.id===tmpId?{...x,status:"queued",title:url.slice(0,40)}:x));
      }
    }
  },[addNotif]);

  const handleDrop=(e)=>{
    e.preventDefault();setOver(false);
    const text=e.dataTransfer.getData("text/plain")||e.dataTransfer.getData("text/uri-list");
    if(text){const u=parseURLs(text);if(u.length){addURLs(u);return;}}
    addNotif("Drop a link or text with URLs","info");
  };

  const downloadOne=async(track)=>{
    if(cancelRef.current)return false;
    setTracks(t=>t.map(x=>x.id===track.id?{...x,status:"downloading",progress:10}:x));
    try{
      // Start download
      const res=await fetch(`${BACKEND}/download`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({url:track.url,format:fmt,quality:qual}),
      });
      const {job_id}=await res.json();

      // Poll status
      let attempts=0;
      while(attempts<120){
        if(cancelRef.current)return false;
        await new Promise(r=>setTimeout(r,2000));
        const st=await fetch(`${BACKEND}/status/${job_id}`);
        const data=await st.json();
        setTracks(t=>t.map(x=>x.id===track.id?{...x,progress:Math.min(90,10+attempts*5)}:x));
        if(data.status==="done"){
          // Trigger real browser download
          const a=document.createElement("a");
          a.href=`${BACKEND}/file/${job_id}`;
          a.download=data.filename||"track.mp3";
          document.body.appendChild(a);a.click();document.body.removeChild(a);
          setTracks(t=>t.map(x=>x.id===track.id?{...x,status:"done",progress:100}:x));
          return true;
        }
        if(data.status==="error"){
          setTracks(t=>t.map(x=>x.id===track.id?{...x,status:"error",progress:0}:x));
          return false;
        }
        attempts++;
      }
      setTracks(t=>t.map(x=>x.id===track.id?{...x,status:"error"}:x));
      return false;
    }catch(e){
      setTracks(t=>t.map(x=>x.id===track.id?{...x,status:"error",progress:0}:x));
      return false;
    }
  };

  const startAll=async()=>{
    if(backendStatus!=="ok"){addNotif("Backend not connected!","err");return;}
    const queued=tracks.filter(t=>t.status==="queued"||t.status==="error");
    if(!queued.length){addNotif("No tracks to download","err");return;}
    cancelRef.current=false;setRunning(true);setModalDone(false);setShowModal(true);setStartTime(Date.now());
    let done=0;
    // 2 parallel downloads
    const chunks=[];for(let i=0;i<queued.length;i+=2)chunks.push(queued.slice(i,i+2));
    for(const chunk of chunks){
      if(cancelRef.current)break;
      const res=await Promise.all(chunk.map(t=>downloadOne(t)));
      done+=res.filter(Boolean).length;
    }
    setRunning(false);setModalDone(true);
    const nh=[{date:new Date().toLocaleDateString(),count:done,fmt,qual},...history].slice(0,60);
    setHistory(nh);
    setTotalAll(td=>{const next=td+done;window.storage.set("dp3-total",JSON.stringify(next)).catch(()=>{});return next;});
    window.storage.set("dp3-hist",JSON.stringify(nh)).catch(()=>{});
  };

  const cancelDL=()=>{
    cancelRef.current=true;setRunning(false);setShowModal(false);
    setTracks(t=>t.map(x=>x.status==="downloading"?{...x,status:"queued",progress:0}:x));
    addNotif("Cancelled","err");
  };

  const queuedN=tracks.filter(t=>t.status==="queued").length;
  const doneN=tracks.filter(t=>t.status==="done").length;
  const errorsN=tracks.filter(t=>t.status==="error").length;
  const dlN=tracks.filter(t=>t.status==="downloading"||t.status==="fetching").length;
  const totalDur=tracks.reduce((a,t)=>(t.duration||0)+a,0);
  const qCount=tracks.filter(t=>t.status==="queued"||t.status==="error").length;

  const backendLabel=backendStatus==="ok"?"● Backend connected":backendStatus==="err"?"● Backend offline — check Railway":backendStatus==="unconfigured"?"● Paste your Railway URL in the HTML file":"● Checking backend…";

  return(
    <>
      <style>{CSS}</style>
      <Notifs list={notifs}/>
      {showModal&&<ProgressModal tracks={tracks} onCancel={cancelDL} startTime={startTime||Date.now()} isComplete={modalDone} onClose={()=>{setShowModal(false);setModalDone(false);}}/>}
      <div className="wrap">
        <div className="grain"/>
        <div className="blob" style={{width:500,height:500,background:"rgba(198,241,53,.025)",top:-150,right:-120}}/>
        <div className="blob" style={{width:350,height:350,background:"rgba(255,45,120,.025)",bottom:50,left:-100}}/>
        <div className="inner">
          <header className="hdr">
            <Logo size={52}/>
            <div className="hdr-txt">
              <div className="appname">DRAG<em>&</em>PLAY</div>
              <div className="apptag">DJ Bulk Downloader · YT · SC · Bandcamp · TikTok</div>
            </div>
            <div className="hdr-stats">
              <div className="hpill"><strong className="g">{totalAll+doneN}</strong>total DL</div>
              <div className="hpill"><strong className="b">{tracks.length}</strong>in queue</div>
              {totalDur>0&&<div className="hpill"><strong className="p">{fmtDurLong(totalDur)}</strong>runtime</div>}
            </div>
          </header>

          <div className={`backend-bar ${backendStatus==="ok"?"ok":backendStatus==="checking"?"checking":"err"}`}>
            {backendLabel}
          </div>

          <div className={`dz${over?" over":""}`}
            onDragOver={e=>{e.preventDefault();setOver(true);}}
            onDragLeave={()=>setOver(false)}
            onDrop={handleDrop}
            onClick={()=>{const u=prompt("Paste URL (track, playlist, set, album):");if(u)addURLs(parseURLs(u));}}>
            <div className="dzi">{over?"↓":"⬇"}</div>
            <div className="dzt">{over?"Drop it here":"Drag links here"}</div>
            <div className="dzs">Single tracks · playlists · sets · albums · real download</div>
            <div className="src-row">
              {[{n:"YouTube",c:"#ff3e3e"},{n:"SoundCloud",c:"#ff6b1a"},{n:"Bandcamp",c:"#2de0ff"},{n:"TikTok",c:"#ff2d78"},{n:"Mixcloud",c:"#ffd600"}].map(s=>(
                <span key={s.n} className="src"><span className="dot" style={{background:s.c}}/>{s.n}</span>
              ))}
            </div>
          </div>

          <div className="paste">
            <div className="paste-hdr">
              <span className="paste-lbl">// Paste URLs · one per line · playlists expand automatically</span>
              <button className="btn-ghost btn-sm" onClick={()=>{navigator.clipboard.readText?.().then(t=>setPaste(p=>p?p+"\n"+t:t)).catch(()=>{});}}>Paste clipboard</button>
            </div>
            <textarea className="paste-ta" value={paste} onChange={e=>setPaste(e.target.value)}
              placeholder={"https://youtube.com/watch?v=...\nhttps://youtube.com/playlist?list=...\nhttps://soundcloud.com/artist/sets/my-set"}
              onKeyDown={e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();addURLs(parseURLs(paste));setPaste("");}}}
            />
            <div className="paste-foot">
              <span className="paste-foot-txt">{paste.split("\n").filter(l=>l.trim()).length} line(s) · ⌘↵ to add</span>
              <button className="btn-ghost btn-sm" onClick={()=>{addURLs(parseURLs(paste));setPaste("");}} disabled={!paste.trim()}>→ Add to queue</button>
            </div>
          </div>

          <div className="fmt-row">
            <span className="fmt-lbl">Format:</span>
            {["MP3","WAV","FLAC","AIFF","M4A"].map(f=>(
              <button key={f} className={`fmtb${fmt===f?" on":""}`} onClick={()=>setFmt(f)}>{f}</button>
            ))}
            {fmt==="MP3"&&<><div className="fmt-sep"/><span className="fmt-lbl">Quality:</span>{["128","192","256","320"].map(q=><button key={q} className={`fmtb${qual===q?" on":""}`} onClick={()=>setQual(q)}>{q}k</button>)}</>}
            {fmt==="FLAC"&&<><div className="fmt-sep"/><span className="fmt-lbl">Depth:</span>{["16-bit","24-bit"].map(q=><button key={q} className={`fmtb${qual===q?" on":""}`} onClick={()=>setQual(q)}>{q}</button>)}</>}
          </div>

          <div className="tabs">
            <button className={`tab${tab==="queue"?" on":""}`} onClick={()=>setTab("queue")}>Queue {tracks.length>0&&`(${tracks.length})`}</button>
            <button className={`tab${tab==="history"?" on":""}`} onClick={()=>setTab("history")}>History {history.length>0&&`(${history.length})`}</button>
          </div>

          {tab==="queue"&&(
            <>
              {tracks.length>0&&(
                <div className="total-bar">
                  <div className="tstat"><div className="tstat-lbl">Total runtime</div><div className="tstat-val y">{fmtDurLong(totalDur)}</div></div>
                  <div className="tstat"><div className="tstat-lbl">To download</div><div className="tstat-val b">{qCount}</div></div>
                  <div className="tstat"><div className="tstat-lbl">Est. time</div><div className="tstat-val g">{estDL(qCount,fmt)}</div></div>
                  <div className="tstat"><div className="tstat-lbl">Done</div><div className="tstat-val" style={{color:doneN>0?"var(--g)":"var(--muted)"}}>{doneN}</div></div>
                </div>
              )}
              {tracks.length>0&&(
                <div className="qctrl">
                  <div className="qctrl-l"><span className="qtitle">Queue</span><span className="qcnt">{queuedN} queued · {doneN} done · {errorsN} err</span></div>
                  {doneN>0&&<button className="btn-ghost btn-sm" onClick={()=>setTracks(t=>t.filter(x=>x.status!=="done"))}>Clear done</button>}
                  <button className="btn-danger btn-sm" onClick={()=>{setTracks([]);addNotif("Queue cleared","info");}}>Clear all</button>
                </div>
              )}
              {tracks.length===0?(
                <div className="empty"><div className="empty-icon">🎛</div><div className="empty-txt">Drop links or paste URLs above</div></div>
              ):(
                <>
                  <div className="tracklist">
                    {tracks.map(t=>(
                      <div key={t.id} className={`track s-${t.status}`}>
                        <div className="track-prog" style={{width:`${t.progress}%`}}/>
                        <div className="t-plat" style={{background:t.platform.bg,color:t.platform.color}}>{t.platform.icon}</div>
                        <div className="t-info">
                          <div className="t-name">{t.title}</div>
                          <div className="t-url">{t.url.slice(0,60)}{t.url.length>60?"…":""}</div>
                        </div>
                        {t.duration>0&&<div className="t-dur">{fmtDur(t.duration)}</div>}
                        <div className="t-meta">
                          {t.status==="queued"&&<span className="tbadge q">queued</span>}
                          {t.status==="fetching"&&<span className="tbadge az">fetching…</span>}
                          {t.status==="downloading"&&<span className="tbadge dl">↓ downloading</span>}
                          {t.status==="done"&&<span className="tbadge done">✓ saved</span>}
                          {t.status==="error"&&<span className="tbadge err">✕ failed</span>}
                          <button className="t-rm" onClick={()=>setTracks(t2=>t2.filter(x=>x.id!==t.id))}>×</button>
                        </div>
                      </div>
                    ))}
                  </div>
                  {qCount>0&&(
                    <button className="dl-all-btn"
                      style={{background:running||backendStatus!=="ok"?"var(--panel2)":"var(--g)",color:running||backendStatus!=="ok"?"var(--muted)":"var(--black)",border:running||backendStatus!=="ok"?"1px solid var(--border)":"none"}}
                      onClick={startAll} disabled={running||backendStatus!=="ok"}>
                      <span style={{fontSize:18}}>⬇</span>
                      {running?`Downloading… (${dlN} active)`:`Download all ${qCount} tracks · ${fmt}${fmt==="MP3"?" "+qual+"k":""}`}
                      {!running&&backendStatus==="ok"&&<span style={{opacity:.6,fontSize:11}}>· est. {estDL(qCount,fmt)}</span>}
                      {backendStatus!=="ok"&&!running&&<span style={{opacity:.6,fontSize:11}}>· connect backend first</span>}
                    </button>
                  )}
                </>
              )}
            </>
          )}
          {tab==="history"&&(
            history.length===0?
            <div className="empty"><div className="empty-icon">📂</div><div className="empty-txt">No history yet</div></div>:
            <div className="tracklist">
              {history.map((h,i)=>(
                <div key={i} className="track s-done">
                  <div className="t-plat" style={{background:"rgba(198,241,53,.1)",color:"var(--g)"}}>⊞</div>
                  <div className="t-info"><div className="t-name">Session · {h.date}</div><div className="t-url">{h.count} tracks · {h.fmt}{h.qual&&h.fmt==="MP3"?" "+h.qual+"k":""}</div></div>
                  <span className="tbadge done">✓ {h.count}</span>
                </div>
              ))}
            </div>
          )}
          <div className="footer">
            <span>DRAG&amp;PLAY · v3.0 · real downloads</span>
            <span>yt-dlp · ffmpeg · Railway backend</span>
          </div>
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
