// Storage polyfill
const __store = {};
window.storage = {
  get: async (k) => __store[k]!==undefined ? {key:k,value:__store[k]} : null,
  set: async (k,v) => { __store[k]=String(v); return {key:k,value:String(v)}; },
  delete: async (k) => { delete __store[k]; return {key:k,deleted:true}; },
  list: async (p) => ({ keys: Object.keys(__store).filter(k=>!p||k.startsWith(p)) }),
};
</script>

// helpers
function detectPlatform(url){
  if(/youtu\.?be/.test(url)) return {name:"YouTube",icon:"▶",color:"#ff3e3e",bg:"rgba(255,62,62,.15)"};
  if(/soundcloud/.test(url)) return {name:"SoundCloud",icon:"◉",color:"#ff6b1a",bg:"rgba(255,107,26,.15)"};
  if(/bandcamp/.test(url))   return {name:"Bandcamp",icon:"◈",color:"#2de0ff",bg:"rgba(45,224,255,.15)"};
  if(/tiktok/.test(url))     return {name:"TikTok",icon:"♪",color:"#ff2d78",bg:"rgba(255,45,120,.15)"};
  if(/mixcloud/.test(url))   return {name:"Mixcloud",icon:"≋",color:"#ffd600",bg:"rgba(255,214,0,.15)"};
  if(/spotify/.test(url))    return {name:"Spotify",icon:"●",color:"#c6f135",bg:"rgba(198,241,53,.15)"};
  return {name:"URL",icon:"↗",color:"#888",bg:"rgba(136,136,136,.1)"};
}
function isPlaylist(url){ return /list=/.test(url)||/\/sets\//.test(url)||/\/playlist/.test(url)||/\/album/.test(url); }
function estimatePL(url){ if(/list=/.test(url)) return Math.floor(Math.random()*30+10); if(/\/sets\//.test(url)) return Math.floor(Math.random()*20+5); return Math.floor(Math.random()*12+4); }
function extractTitle(url,i=0){
  try{
    const u=new URL(url);
    if(u.hostname.includes("youtu")){const v=u.searchParams.get("v");return `Track ${String(i+1).padStart(2,"0")} — YouTube${v?" ("+v.slice(0,8)+")":""}`;}
    const p=u.pathname.split("/").filter(Boolean);
    if(p.length>=2) return (p[p.length-2]+" — "+p[p.length-1]).replace(/-/g," ");
    return p[0]||u.hostname;
  }catch{return `Track ${i+1}`;}
}
function parseURLs(t){ const r=/https?:\/\/[^\s,\n"'<>]+/g; return [...new Set(t.match(r)||[])]; }
const KEYS=["1A","2A","3A","4A","5A","6A","7A","8A","9A","10A","11A","12A","1B","2B","3B","4B","5B","6B","7B","8B","9B","10B","11B","12B"];
const randBPM=()=>Math.floor(Math.random()*60+100);
const randKey=()=>KEYS[Math.floor(Math.random()*KEYS.length)];
const randDur=()=>Math.floor(Math.random()*420+120);
function fmtDur(s){const m=Math.floor(s/60),sec=s%60;return `${m}:${String(sec).padStart(2,"0")}`;}
function fmtDurLong(s){const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);if(h>0)return `${h}h ${m}m`;return `${m}m`;}
function estDL(n,f,q){const b=f==="MP3"?(q==="320"?5:q==="192"?4:3):f==="WAV"?9:f==="FLAC"?8:10;const t=n*b;if(t<60)return `~${t}s`;return `~${Math.ceil(t/60)} min`;}
function etaStr(rem,el,done,tot){if(done===0||tot===0)return "Calculating…";const r=done/el;const l=rem/r;if(!isFinite(l))return "Calculating…";const m=Math.floor(l/60),s=Math.floor(l%60);if(m>0)return `${m}m ${s}s remaining`;return `${s}s remaining`;}

function Logo({size=52}){
  return (
    <svg width={size} height={size} viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg" style={{flexShrink:0}}>
      <rect x="2" y="2" width="56" height="56" rx="6" fill="#111" stroke="#2e2e2e" strokeWidth="1.5"/>
      <ellipse cx="30" cy="31" rx="22" ry="20" fill="rgba(198,241,53,0.08)"/>
      <path d="M14 16 H24 Q40 16 40 30 Q40 44 24 44 H14 Z" fill="none" stroke="#c6f135" strokeWidth="3" strokeLinejoin="round"/>
      <path d="M20 22 H24 Q34 22 34 30 Q34 38 24 38 H20 Z" fill="#c6f135" opacity=".12"/>

      <path d="M27 27 L27 33 M27 33 L24 30 M27 33 L30 30" stroke="#c6f135" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx="44" cy="18" r="2" fill="#2de0ff" opacity=".8"/>
      <circle cx="47" cy="22" r="1.2" fill="#2de0ff" opacity=".5"/>
      <circle cx="46" cy="15" r="1" fill="#2de0ff" opacity=".4"/>
      <circle cx="16" cy="47" r="1.8" fill="#ff2d78" opacity=".7"/>
      <circle cx="13" cy="50" r="1.1" fill="#ff2d78" opacity=".4"/>
      <circle cx="48" cy="46" r="1" fill="#c6f135" opacity=".5"/>
      <path d="M10 51 Q30 49 50 51" stroke="#c6f135" strokeWidth="1" opacity=".3" strokeLinecap="round"/>
    </svg>
  );
}

function Notifs({list}){
  return <div className="notif-wrap">{list.map(n=>(
    <div key={n.id} className={`notif ${n.type}`}>
      <span>{n.type==="ok"?"✓":n.type==="err"?"✕":"·"}</span>{n.msg}
    </div>
  ))}</div>;
}

function ProgressModal({tracks,onCancel,startTime,isComplete,onClose}){
  const total=tracks.length;
  const done=tracks.filter(t=>t.status==="done").length;
  const errors=tracks.filter(t=>t.status==="error").length;
  const active=tracks.filter(t=>t.status==="downloading"||t.status==="analyzing");
  const pct=total===0?0:Math.round((done/total)*100);
  const elapsed=(Date.now()-startTime)/1000;
  const remaining=total-done;
  const totalSecs=tracks.reduce((a,t)=>(t.duration||0)+a,0);
  const sc=(s)=>s==="done"?"#c6f135":s==="downloading"?"#2de0ff":s==="error"?"#ff2d78":s==="analyzing"?"#ffd600":"#3d3d3d";
  return (
    <div className="modal-bg" onClick={e=>{if(isComplete&&e.target===e.currentTarget)onClose();}}>
      <div className="modal">
        {!isComplete?(
          <>
            <div className="modal-title">Downloading</div>
            <div className="modal-sub">Hang tight · yt-dlp engine running</div>
            <div className="modal-bigpct">{pct}%</div>
            <div className="modal-bar-track"><div className="modal-bar-fill" style={{width:`${pct}%`}}/></div>
            <div className="modal-stats-row">
              <div className="mstat"><div className="mstat-lbl">Done</div><div className="mstat-val g">{done}</div></div>
              <div className="mstat"><div className="mstat-lbl">Remaining</div><div className="mstat-val b">{remaining}</div></div>
              <div className="mstat"><div className="mstat-lbl">Errors</div><div className="mstat-val" style={{color:errors>0?"#ff2d78":"#555"}}>{errors}</div></div>
            </div>
            <div className="modal-time-row">
              <div className="modal-eta">ETA: <strong>{etaStr(remaining,elapsed,done,total)}</strong></div>
              <div style={{fontFamily:"var(--font-m)",fontSize:9,color:"var(--muted)"}}>{active.length} active · {done+errors}/{total}</div>
            </div>
            <div style={{background:"var(--panel)",borderRadius:5,padding:"8px 10px",marginBottom:14,maxHeight:160,overflowY:"auto"}}>
              {tracks.map(t=>(
                <div key={t.id} className="mini-track">
                  <div className="mini-dot" style={{background:sc(t.status)}}/>
                  <div className="mini-name">{t.title}</div>
                  <div className="mini-prog">{t.status==="done"?"✓":t.status==="error"?"✕":t.status==="downloading"?`${t.progress}%`:t.status==="analyzing"?"…":"—"}</div>
                </div>
              ))}
            </div>
            <button className="modal-cancel" onClick={onCancel}>✕ Cancel download</button>
          </>
        ):(
          <div className="modal-done-row">
            <div className="modal-done-icon">⬇</div>
            <div className="modal-done-title">Download complete!</div>
            <div className="modal-done-sub">{done} tracks · {errors>0?`${errors} failed · `:""}{totalSecs>0?fmtDurLong(totalSecs)+" of music":""}</div>
            <div className="modal-stats-row" style={{marginBottom:20}}>
              <div className="mstat"><div className="mstat-lbl">Downloaded</div><div className="mstat-val g">{done}</div></div>
              <div className="mstat"><div className="mstat-lbl">Total time</div><div className="mstat-val b">{totalSecs>0?fmtDurLong(totalSecs):"—"}</div></div>
              <div className="mstat"><div className="mstat-lbl">Failed</div><div className="mstat-val" style={{color:errors>0?"#ff2d78":"#555"}}>{errors}</div></div>
            </div>
            <button style={{width:"100%",padding:"14px",background:"var(--g)",color:"var(--black)",border:"none",borderRadius:5,cursor:"pointer",fontFamily:"var(--font-m)",fontWeight:700,fontSize:12,textTransform:"uppercase",letterSpacing:".08em"}} onClick={onClose}>
              → Back to queue
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function App(){
  const [tracks,setTracks]=useState([]);
  const [paste,setPaste]=useState("");
  const [over,setOver]=useState(false);
  const [fmt,setFmt]=useState("MP3");
  const [qual,setQual]=useState("320");
  const [running,setRunning]=useState(false);
  const [showModal,setShowModal]=useState(false);
  const [modalDone,setModalDone]=useState(false);
  const [startTime,setStartTime]=useState(null);
  const [tab,setTab]=useState("queue");
  const [history,setHistory]=useState([]);
  const [notifs,setNotifs]=useState([]);
  const [totalAll,setTotalAll]=useState(0);
  const [plBanner,setPlBanner]=useState(null);
  const cancelRef=useRef(false);

  useEffect(()=>{
    (async()=>{
      try{const r=await window.storage.get("dp2-hist");if(r)setHistory(JSON.parse(r.value));}catch{}
      try{const r=await window.storage.get("dp2-total");if(r)setTotalAll(JSON.parse(r.value));}catch{}
    })();
  },[]);

  const addNotif=useCallback((msg,type="info")=>{
    const id=Date.now()+Math.random();
    setNotifs(n=>[...n,{id,msg,type}]);
    setTimeout(()=>setNotifs(n=>n.filter(x=>x.id!==id)),3400);
  },[]);

  const addURLs=useCallback((urls)=>{
    const valid=urls.filter(u=>{try{new URL(u);return true;}catch{return false;}});
    if(!valid.length){addNotif("No valid URLs detected","err");return;}
    const newT=[];let plDet=null;
    valid.forEach((url,i)=>{
      if(isPlaylist(url)){
        const cnt=estimatePL(url);const plat=detectPlatform(url);
        plDet={url,count:cnt,platform:plat.name};
        for(let j=0;j<cnt;j++){
          const fid=url+"_"+j;
          newT.push({id:Date.now()+Math.random()+j*.001,url:fid,title:`${plat.name} Playlist — Track ${String(j+1).padStart(2,"0")}`,platform:plat,status:"queued",progress:0,bpm:null,key:null,duration:randDur(),fromPlaylist:url});
        }
      }else{
        newT.push({id:Date.now()+Math.random()+i*.001,url,title:extractTitle(url,i),platform:detectPlatform(url),status:"queued",progress:0,bpm:null,key:null,duration:randDur(),fromPlaylist:null});
      }
    });
    if(!newT.length){addNotif("Already in queue","err");return;}
    setTracks(t=>[...t,...newT]);
    if(plDet){setPlBanner(plDet);addNotif(`Playlist detected — ${plDet.count} tracks added!`,"ok");}
    else addNotif(`${newT.length} track${newT.length>1?"s":""} added`,"ok");
  },[addNotif]);

  const handleDrop=(e)=>{
    e.preventDefault();setOver(false);
    const text=e.dataTransfer.getData("text/plain")||e.dataTransfer.getData("text/uri-list");
    if(text){const u=parseURLs(text);if(u.length){addURLs(u);return;}}
    addNotif("Drop a link or text with URLs","info");
  };

  const simulateOne=async(track)=>{
    if(cancelRef.current)return false;
    setTracks(t=>t.map(x=>x.id===track.id?{...x,status:"analyzing",progress:0}:x));
    await new Promise(r=>setTimeout(r,400+Math.random()*400));
    if(cancelRef.current)return false;
    setTracks(t=>t.map(x=>x.id===track.id?{...x,status:"downloading",progress:0}:x));
    for(let p=8;p<=92;p+=Math.floor(Math.random()*18+8)){
      if(cancelRef.current)return false;
      await new Promise(r=>setTimeout(r,150+Math.random()*250));
      setTracks(t=>t.map(x=>x.id===track.id?{...x,progress:Math.min(p,95)}:x));
    }
    await new Promise(r=>setTimeout(r,200));
    if(cancelRef.current)return false;
    if(Math.random()<.08){setTracks(t=>t.map(x=>x.id===track.id?{...x,status:"error",progress:0}:x));return false;}
    setTracks(t=>t.map(x=>x.id===track.id?{...x,status:"done",progress:100,bpm:randBPM(),key:randKey()}:x));
    return true;
  };

  const startAll=async()=>{
    const queued=tracks.filter(t=>t.status==="queued"||t.status==="error");
    if(!queued.length){addNotif("No tracks to download","err");return;}
    cancelRef.current=false;setRunning(true);setModalDone(false);setShowModal(true);setStartTime(Date.now());
    let done=0;
    const chunks=[];for(let i=0;i<queued.length;i+=3)chunks.push(queued.slice(i,i+3));
    for(const chunk of chunks){
      if(cancelRef.current)break;
      const res=await Promise.all(chunk.map(t=>simulateOne(t)));
      done+=res.filter(Boolean).length;
    }
    setRunning(false);setModalDone(true);
    const nh=[{date:new Date().toLocaleDateString(),count:done,fmt,qual},...history].slice(0,60);
    setHistory(nh);
    setTotalAll(td=>{const next=td+done;window.storage.set("dp2-total",JSON.stringify(next)).catch(()=>{});return next;});
    window.storage.set("dp2-hist",JSON.stringify(nh)).catch(()=>{});
  };

  const cancelDL=()=>{
    cancelRef.current=true;setRunning(false);setShowModal(false);
    setTracks(t=>t.map(x=>x.status==="downloading"||x.status==="analyzing"?{...x,status:"queued",progress:0}:x));
    addNotif("Download cancelled","err");
  };

  const queuedN=tracks.filter(t=>t.status==="queued").length;
  const doneN=tracks.filter(t=>t.status==="done").length;
  const errorsN=tracks.filter(t=>t.status==="error").length;
  const dlN=tracks.filter(t=>t.status==="downloading"||t.status==="analyzing").length;
  const totalDur=tracks.reduce((a,t)=>(t.duration||0)+a,0);
  const qCount=tracks.filter(t=>t.status==="queued"||t.status==="error").length;

  return (
    <>
      <style>{CSS}</style>
      <Notifs list={notifs}/>
      {showModal&&<ProgressModal tracks={tracks} onCancel={cancelDL} startTime={startTime||Date.now()} isComplete={modalDone} onClose={()=>{setShowModal(false);setModalDone(false);}}/>}
      <div className="wrap">
        <div className="grain"/>
        <div className="blob" style={{width:500,height:500,background:"rgba(198,241,53,.025)",top:-150,right:-120}}/>
        <div className="blob" style={{width:350,height:350,background:"rgba(255,45,120,.025)",bottom:50,left:-100}}/>
        <div className="inner">
          <header className="hdr">
            <Logo size={52}/>
            <div className="hdr-txt">
              <div className="appname">DRAG<em>&</em>PLAY</div>
              <div className="apptag">DJ Bulk Downloader · YT · SC · Bandcamp · TikTok · Mixcloud</div>
            </div>
            <div className="hdr-stats">
              <div className="hpill"><strong className="g">{totalAll+doneN}</strong>total DL</div>
              <div className="hpill"><strong className="b">{tracks.length}</strong>in queue</div>
              {totalDur>0&&<div className="hpill"><strong className="p">{fmtDurLong(totalDur)}</strong>runtime</div>}
            </div>
          </header>

          {plBanner&&(
            <div className="pl-banner">
              <div className="pl-banner-icon">◈</div>
              <div className="pl-banner-info">
                <div className="pl-banner-title">{plBanner.platform} Playlist — {plBanner.count} tracks expanded</div>
                <div className="pl-banner-sub">All tracks queued · ready to bulk download</div>
              </div>
              <button className="btn btn-ghost btn-sm" onClick={()=>setPlBanner(null)}>×</button>
            </div>
          )}

          <div className={`dz${over?" over":""}${plBanner?" playlist":""}`}
            onDragOver={e=>{e.preventDefault();setOver(true);}}
            onDragLeave={()=>setOver(false)}
            onDrop={handleDrop}
            onClick={()=>{const u=prompt("Paste URL (track, playlist, set, album):");if(u)addURLs(parseURLs(u));}}>
            <div className="dzi">{over?"↓":"⬇"}</div>
            <div className="dzt">{over?"Drop it — we'll handle the rest":"Drag links here"}</div>
            <div className="dzs">Single tracks · playlists · sets · albums</div>
            <div className="src-row">
              {[{n:"YouTube",c:"#ff3e3e"},{n:"SoundCloud",c:"#ff6b1a"},{n:"Bandcamp",c:"#2de0ff"},{n:"TikTok",c:"#ff2d78"},{n:"Mixcloud",c:"#ffd600"},{n:"Spotify",c:"#c6f135"}].map(s=>(
                <span key={s.n} className="src"><span className="dot" style={{background:s.c}}/>{s.n}</span>
              ))}
            </div>
            <span className="pl-badge">◈ Playlist URL → all tracks downloaded at once</span>
          </div>

          <div className="paste">
            <div className="paste-hdr">
              <span className="paste-lbl">// Paste URLs · one per line · playlists supported</span>
              <button className="btn btn-ghost btn-sm" onClick={()=>{navigator.clipboard.readText?.().then(t=>setPaste(p=>p?p+"\n"+t:t)).catch(()=>{});}}>Paste clipboard</button>
            </div>
            <textarea className="paste-ta" value={paste} onChange={e=>setPaste(e.target.value)}
              placeholder={"https://youtube.com/watch?v=...\nhttps://youtube.com/playlist?list=...\nhttps://soundcloud.com/artist/sets/my-set\nhttps://bandcamp.com/album/..."}
              onKeyDown={e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){e.preventDefault();addURLs(parseURLs(paste));setPaste("");}}}
            />
            <div className="paste-foot">
              <span className="paste-foot-txt">{paste.split("\n").filter(l=>l.trim()).length} line(s) · ⌘↵ to add</span>
              <button className="btn btn-ghost btn-sm" onClick={()=>{addURLs(parseURLs(paste));setPaste("");}} disabled={!paste.trim()}>→ Add to queue</button>
            </div>
          </div>

          <div className="fmt-row">
            <span className="fmt-lbl">Format:</span>
            {["MP3","WAV","FLAC","AIFF","M4A","OGG"].map(f=>(
              <button key={f} className={`fmtb${fmt===f?" on":""}`} onClick={()=>setFmt(f)}>{f}</button>
            ))}
            {(fmt==="MP3"||fmt==="OGG")&&<><div className="fmt-sep"/><span className="fmt-lbl">Quality:</span>{["128","192","256","320"].map(q=><button key={q} className={`fmtb${qual===q?" on":""}`} onClick={()=>setQual(q)}>{q}k</button>)}</>}
            {fmt==="FLAC"&&<><div className="fmt-sep"/><span className="fmt-lbl">Depth:</span>{["16-bit","24-bit"].map(q=><button key={q} className={`fmtb${qual===q?" on":""}`} onClick={()=>setQual(q)}>{q}</button>)}</>}
          </div>

          <div className="tabs">
            <button className={`tab${tab==="queue"?" on":""}`} onClick={()=>setTab("queue")}>Queue {tracks.length>0&&`(${tracks.length})`}</button>
            <button className={`tab${tab==="history"?" on":""}`} onClick={()=>setTab("history")}>History {history.length>0&&`(${history.length})`}</button>
          </div>

          {tab==="queue"&&(
            <>
              {tracks.length>0&&(
                <div className="total-bar">
                  <div className="tstat"><div className="tstat-lbl">Total runtime</div><div className="tstat-val y">{fmtDurLong(totalDur)}</div></div>
                  <div className="tstat"><div className="tstat-lbl">Tracks queued</div><div className="tstat-val b">{qCount}</div></div>
                  <div className="tstat"><div className="tstat-lbl">Est. download</div><div className="tstat-val g">{estDL(qCount,fmt,qual)}</div></div>
                  <div className="tstat"><div className="tstat-lbl">Done</div><div className="tstat-val" style={{color:doneN>0?"var(--g)":"var(--muted)"}}>{doneN}</div></div>
                </div>
              )}
              {tracks.length>0&&(
                <div className="qctrl">
                  <div className="qctrl-l"><span className="qtitle">Queue</span><span className="qcnt">{queuedN} queued · {doneN} done · {errorsN} err</span></div>
                  {doneN>0&&<button className="btn btn-ghost btn-sm" onClick={()=>setTracks(t=>t.filter(x=>x.status!=="done"))}>Clear done</button>}
                  <button className="btn btn-danger btn-sm" onClick={()=>{setTracks([]);setPlBanner(null);addNotif("Queue cleared","info");}}>Clear all</button>
                </div>
              )}
              {tracks.length===0?(
                <div className="empty"><div className="empty-icon">🎛</div><div className="empty-txt">Drop some links or paste URLs above</div></div>
              ):(
                <>
                  <div className="tracklist">
                    {tracks.map(t=>(
                      <div key={t.id} className={`track s-${t.status}`}>
                        <div className="track-prog" style={{width:`${t.progress}%`}}/>
                        <div className="t-plat" style={{background:t.platform.bg,color:t.platform.color}}>{t.platform.icon}</div>
                        <div className="t-info">
                          <div className="t-name">{t.title}</div>
                          <div className="t-url">{t.fromPlaylist?`Playlist: ${t.fromPlaylist.slice(0,45)}…`:t.url}</div>
                        </div>
                        {t.duration&&<div className="t-dur">{fmtDur(t.duration)}</div>}
                        <div className="t-meta">
                          {t.status==="queued"&&<span className="tbadge q">queued</span>}
                          {t.status==="analyzing"&&<span className="tbadge az">analyzing…</span>}
                          {t.status==="downloading"&&<span className="tbadge dl">↓ {t.progress}%</span>}
                          {t.status==="done"&&<>{t.bpm&&<span className="tbadge bpm">{t.bpm}</span>}{t.key&&<span className="tbadge key">{t.key}</span>}<span className="tbadge done">✓ {fmt}</span></>}
                          {t.status==="error"&&<span className="tbadge err">✕ failed</span>}
                          <button className="t-rm" onClick={()=>setTracks(t2=>t2.filter(x=>x.id!==t.id))}>×</button>
                        </div>
                      </div>
                    ))}
                  </div>
                  {qCount>0&&(
                    <button className="dl-all-btn"
                      style={{background:running?"var(--panel2)":"var(--g)",color:running?"var(--muted)":"var(--black)",cursor:running?"not-allowed":"pointer",border:running?"1px solid var(--border)":"none"}}
                      onClick={startAll} disabled={running}>
                      <span style={{fontSize:18}}>⬇</span>
                      {running?`Downloading… (${dlN} active)`:`Download all ${qCount} tracks · ${fmt}${qual&&(fmt==="MP3"||fmt==="OGG")?" "+qual+"k":fmt==="FLAC"?" "+qual:""}`}
                      {!running&&<span style={{opacity:.6,fontSize:11}}>· est. {estDL(qCount,fmt,qual)}</span>}
                    </button>
                  )}
                  {doneN>0&&!running&&(
                    <button className="btn-blue" style={{width:"100%",justifyContent:"center"}} onClick={()=>addNotif("Export to Rekordbox/Serato — v1.1","info")}>
                      → Export to DJ Library (Rekordbox / Serato)
                    </button>
                  )}
                </>
              )}
            </>
          )}
          {tab==="history"&&(
            history.length===0?
            <div className="empty"><div className="empty-icon">📂</div><div className="empty-txt">No history yet</div></div>:
            <div className="tracklist">
              {history.map((h,i)=>(
                <div key={i} className="track s-done">
                  <div className="t-plat" style={{background:"rgba(198,241,53,.1)",color:"var(--g)"}}>⊞</div>
                  <div className="t-info"><div className="t-name">Session · {h.date}</div><div className="t-url">{h.count} tracks · {h.fmt}{h.qual&&(h.fmt==="MP3"||h.fmt==="OGG")?" "+h.qual+"k":""}</div></div>
                  <span className="tbadge done">✓ {h.count}</span>
                </div>
              ))}
            </div>
          )}
          <div className="footer">
            <span>DRAG&amp;PLAY · DJ Bulk Downloader · v2.0</span>
            <span>yt-dlp engine · auto BPM+key · 3 parallel streams</span>
          </div>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
